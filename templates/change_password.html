{% extends "base.html" %}
{% block title %}Change password · SmartRide{% endblock %}
{% block content %}
<div class="card narrow"><h1>Change password</h1>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Current password <input type="password" name="current" required></label>
  <label>New password (min 6 characters) <input type="password" name="new" required minlength="6"></label>
  <label>Confirm new password <input type="password" name="confirm" required minlength="6"></label>
  <button>Update password</button>
</form></div>
{% endblock %}
