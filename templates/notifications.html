{% extends "base.html" %}
{% block content %}
<h1>Notifications</h1>
{% if notes %}<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="small">Mark all as read</button></form>{% endif %}
{% for n in notes %}<div class="card {{ '' if n.is_read else 'unread' }}">{{ n.message }}<br><span class="muted">{{ n.created_at }}</span></div>
{% else %}<div class="card muted">Nothing yet.</div>{% endfor %}
{% endblock %}
